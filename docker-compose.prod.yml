# Production-oriented compose override.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from base compose:
# - PostgreSQL / Redis stay internal (no host ports)
# - Ensure .env sets ConnectionStrings__Redis=redis:6379 (compose default)
# - Optionally set Sentry__Dsn and Media__PublicBaseUrl to your public API host

services:
  postgres:
    ports: []

  redis:
    ports: []
